<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Marcus Vance — Independent creative developer, design engineer, and studio founder in London." />
  <title>Marcus Vance — Creative Developer &amp; Design Engineer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- Tactile Paper/Film Grain & Hairline Fold Creases -->
  <div class="bg-paper-creases" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>

  <!-- Live Floating Peer Cursors (pointer-events: none, toggleable via PRESENCE::ON) -->
  <div id="presence-layer" class="presence-layer" aria-hidden="true"></div>

  <!-- Exact 2-Tier Header (height: 96px) -->
  <header class="site-header" role="banner">
    <!-- Tier 1: Micro-Telemetry Strip -->
    <div class="telemetry-strip" aria-label="Live system telemetry">
      <span class="telemetry-chip" id="chip-time">LDN::00:00GMT</span>
      <span class="telemetry-chip" id="chip-fps">FPS::60</span>
      <span class="telemetry-chip" id="chip-online">ONLINE::124</span>
      <span class="telemetry-chip" id="chip-lcp">LCP::1.2s</span>
      <button type="button" class="telemetry-chip telemetry-chip--btn" id="chip-presence" aria-pressed="true" title="Toggle live peer cursors">
        PRESENCE::ON
      </button>
      <button type="button" class="telemetry-chip telemetry-chip--btn" id="chip-booking" data-drawer="contact" title="Open booking & contact">
        BOOKING::Q2’27
      </button>
    </div>

    <!-- Tier 2: Main Header Bar -->
    <div class="header__bar">
      <!-- Left: Geometric MV Monogram -->
      <a href="#top" class="brand-monogram" id="brand-home" aria-label="Marcus Vance — Reset to project 01">
        <svg class="mv-svg" width="54" height="28" viewBox="0 0 54 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Solid circle with cutout M -->
          <circle cx="14" cy="14" r="12.5" class="mv-circle-fill" />
          <path d="M8.5 19.2V8.8H11.1L14 14.3L16.9 8.8H19.5V19.2H17.1V13.1L14.8 17.4H13.2L10.9 13.1V19.2H8.5Z" class="mv-letter-cutout" />
          <!-- Touching stroked rounded square with crisp V -->
          <rect x="27.5" y="1.75" width="24.5" height="24.5" rx="6" class="mv-square-stroke" stroke-width="1.5" />
          <path d="M34.2 8.8H36.8L39.75 16.4L42.7 8.8H45.3L41.1 19.2H38.4L34.2 8.8Z" class="mv-letter-fill" />
        </svg>
      </a>

      <!-- Center: Floating Navpill + ⌘K Button -->
      <div class="header__nav-group">
        <nav class="navpill" aria-label="Primary navigation">
          <button type="button" class="navpill__link" data-drawer="about">About</button>
          <button type="button" class="navpill__link" data-drawer="lab">Lab</button>
          <button type="button" class="navpill__link" data-drawer="writing">Writing</button>
          <button type="button" class="navpill__link" data-drawer="studio">Studio</button>
          <button type="button" class="navpill__link" data-drawer="contact">Contact</button>
        </nav>

        <button type="button" class="cmdk-trigger" id="cmdk-trigger" aria-label="Open command palette" aria-haspopup="dialog">
          <span class="cmdk-trigger__key">⌘K</span>
        </button>
      </div>

      <!-- Right: Bell (What's New) + Segmented Theme Toggle -->
      <div class="header__actions">
        <button type="button" class="icon-btn" id="whats-new-btn" data-drawer="updates" aria-label="What's new" title="What's new">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="icon-btn__dot" aria-hidden="true"></span>
        </button>

        <div class="theme-toggle" role="group" aria-label="Color theme">
          <button type="button" class="theme-toggle__btn" data-theme-set="light" aria-label="Light mode" aria-pressed="false" title="Light mode">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" /><path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" /><path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
            </svg>
          </button>
          <button type="button" class="theme-toggle__btn is-active" data-theme-set="dark" aria-label="Dark mode" aria-pressed="true" title="Dark mode">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Locked 100vw × 100vh Twin-Wheel Stage -->
  <main class="hv2__stage" id="hv2-stage" aria-label="Selected projects showcase">
    <!-- Left Curved Wheel: Large Landscape Media Preview Cards -->
    <section class="hv2__wheel hv2__wheel--media" id="wheel-media" aria-label="Project previews"></section>

    <!-- Center Metadata & CTA Stack -->
    <section class="hv2__center" aria-live="polite">
      <div class="hv2__counter" id="stage-counter">N°01 / 12</div>

      <div class="hv2__title-drum" aria-label="Project title">
        <h1 class="hv2__title" id="stage-title">Kestrel</h1>
      </div>

      <div class="hv2__meta-pills">
        <span class="hv2__pill" id="stage-collab">W/KESTREL LABS</span>
        <span class="hv2__pill hv2__pill--year" id="stage-year">2026</span>
      </div>

      <button type="button" class="hv2__cta" id="stage-cta">
        <span>View project</span>
      </button>
    </section>

    <!-- Right Curved Wheel: Square Metallic-Bordered Logo/Badge Tiles -->
    <section class="hv2__wheel hv2__wheel--badges" id="wheel-badges" aria-label="Project emblems"></section>
  </main>

  <!-- Bottom-Left Live Presence Toast -->
  <aside class="presence-toast" id="presence-toast" aria-live="polite">
    <span class="presence-toast__dot" aria-hidden="true"></span>
    <div class="presence-toast__body">
      <strong class="presence-toast__title" id="toast-title">Someone joined</strong>
      <span class="presence-toast__sub" id="toast-sub">124 online</span>
    </div>
  </aside>

  <!-- Slide-Over Drawer Backdrop & Panel -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer__header">
      <div class="drawer__eyebrow" id="drawer-eyebrow">ARCHIVE</div>
      <button type="button" class="drawer__close" id="drawer-close" aria-label="Close panel">
        <span>ESC</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="drawer__content" id="drawer-content"></div>
  </aside>

  <!-- ⌘K Command Palette Modal -->
  <div class="cmdk-backdrop" id="cmdk-backdrop" hidden>
    <div class="cmdk-modal" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="cmdk-search-row">
        <svg class="cmdk-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input
          type="text"
          id="cmdk-input"
          class="cmdk-input"
          placeholder="Search projects, drawers, or commands…"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="cmdk-esc">ESC</kbd>
      </div>
      <div class="cmdk-list" id="cmdk-list" role="listbox"></div>
      <div class="cmdk-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>ESC</kbd> close</span>
      </div>
    </div>
  </div>

  <script src="data/projects.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
